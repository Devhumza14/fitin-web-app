<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fitin — Page not found (phone)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#ffffff}
a{color:#0E2340}a:hover{color:#167A7C}
*{box-sizing:border-box}
@media (prefers-reduced-motion: reduce){.bar{transition:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #ffffff; color: #1F2733; font-family: 'Figtree', -apple-system, system-ui, sans-serif; font-size: 16px; line-height: 1.5; display: flex; flex-direction: column; overflow: hidden;">

  <header style="height: 64px; padding: 0 20px; border-bottom: 1px solid #E4E7EB; display: flex; align-items: center; justify-content: space-between; flex: 0 0 auto;">
    <a href="PhoneHome.dc.html" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: #0E2340;">
      <img src="../assets/fitin-logo.png" alt="" style="width: 32px; height: 32px; object-fit: contain;">
      <span style="font-size: 22px; font-weight: 800; letter-spacing: -0.7px;">fitin</span>
    </a>
    <a href="PhoneStart.dc.html" style="height: 40px; padding: 0 16px; border-radius: 9999px; background: #0E2340; color: #ffffff; font-size: 14px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center;">Start</a>
  </header>

  <main style="flex: 1 1 auto; padding: 16px 20px 28px; display: flex; flex-direction: column; gap: 14px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <div aria-hidden="true" style="position: relative; width: 240px; height: 230px;">
        <div class="bar" style="{{bar1}}"><svg width="170" height="78" viewBox="0 0 240 110"><path d="M0 50L240 0v60L0 110z" fill="#0E2340"></path></svg></div>
        <div class="bar" style="{{bar2}}"><svg width="148" height="70" viewBox="0 0 210 100"><path d="M0 46L210 0v54L0 100z" fill="#229E9F"></path></svg></div>
        <div class="bar" style="{{bar3}}"><svg width="126" height="64" viewBox="0 0 180 92"><path d="M0 42L180 0v50L0 92z" fill="#B6D22A"></path></svg></div>
      </div>
      <button type="button" onClick="{{toggle}}" style="height: 44px; padding: 0 18px; border-radius: 9999px; border: 1px solid #0E2340; background: #ffffff; font: inherit; font-size: 14px; font-weight: 600; color: #0E2340; cursor: pointer;">{{toggleLabel}}</button>
    </div>
    <span style="font-size: 12px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: #167A7C; margin-top: 6px;">Error 404</span>
    <h1 style="margin: 0; font-size: 36px; line-height: 1.05; letter-spacing: -1.2px; font-weight: 700; color: #0E2340;">This page doesn't <span style="box-shadow: inset 0 -0.2em 0 #B6D22A;">fit</span>.</h1>
    <p style="margin: 0; font-size: 15px; color: #4A5462;">It may have moved, or the link was mistyped.</p>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: auto;">
      <a href="PhoneExplore.dc.html" style="padding: 14px; border-radius: 16px; border: 1px solid #E4E7EB; text-decoration: none; font-weight: 700;">Explore designs</a>
      <a href="PhoneServices.dc.html" style="padding: 14px; border-radius: 16px; border: 1px solid #E4E7EB; text-decoration: none; font-weight: 700;">Services</a>
      <a href="PhoneStart.dc.html" style="padding: 14px; border-radius: 16px; background: #F2F7E3; text-decoration: none; font-weight: 700;">Start a project</a>
      <a href="PhoneAbout.dc.html" style="padding: 14px; border-radius: 16px; border: 1px solid #E4E7EB; text-decoration: none; font-weight: 700;">Contact us</a>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { fixed: false };
  }
  renderVals() {
    const fixed = this.state.fixed;
    const base = 'position: absolute; left: 36px; transition: transform 700ms cubic-bezier(0.22, 1, 0.36, 1); ';
    return {
      bar1: base + 'top: 24px; transform: ' + (fixed ? 'none' : 'translate(-24px, 100px) rotate(-28deg)') + ';',
      bar2: base + 'top: 100px; transform: ' + (fixed ? 'none' : 'translate(44px, 84px) rotate(18deg)') + ';',
      bar3: base + 'top: 172px; transform: ' + (fixed ? 'none' : 'translate(-8px, -148px) rotate(-62deg)') + ';',
      toggle: () => this.setState({ fixed: !fixed }),
      toggleLabel: fixed ? 'Knock it over again' : 'Put it back together'
    };
  }
}
</script>
</body>
</html>
