<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fitin — Page not found</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#ffffff}
a{color:#0E2340}a:hover{color:#167A7C}
*{box-sizing:border-box}
@media (prefers-reduced-motion: reduce){.bar{transition:none !important}}
</style>
</helmet>
<div style="width: 100%; min-height: 100vh; background: #ffffff; color: #1F2733; font-family: 'Figtree', -apple-system, system-ui, sans-serif; font-size: 16px; line-height: 1.5; display: flex; flex-direction: column;">

  <header style="border-bottom: 1px solid #E4E7EB;">
    <div style="max-width: 1360px; margin: 0 auto; padding: 0 40px; min-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 12px;">
      <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #0E2340;">
        <img src="../assets/fitin-logo.png" alt="" style="width: 36px; height: 36px; object-fit: contain;">
        <span style="font-size: 24px; font-weight: 800; letter-spacing: -0.8px;">fitin</span>
      </a>
      <a href="Start.dc.html" style="height: 44px; padding: 0 20px; border-radius: 9999px; background: #0E2340; color: #ffffff; font-size: 14px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center;">Start project</a>
    </div>
  </header>

  <main style="flex: 1 1 auto; max-width: 1360px; width: 100%; margin: 0 auto; padding: 64px 40px 80px; display: flex; flex-wrap: wrap-reverse; align-items: center; gap: 56px;">
    <div style="flex: 1 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 22px;">
      <span style="font-size: 13px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: #167A7C;">Error 404</span>
      <h1 style="margin: 0; font-size: clamp(44px, 6vw, 72px); line-height: 1.04; letter-spacing: -2.2px; font-weight: 700; color: #0E2340;">This page doesn't <span style="box-shadow: inset 0 -0.2em 0 #B6D22A;">fit</span>.</h1>
      <p style="margin: 0; max-width: 480px; font-size: 19px; color: #4A5462;">It may have moved, or the link was mistyped. Here are some good places to start.</p>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; max-width: 520px; margin-top: 6px;">
        <a href="Explore.dc.html" style="display: flex; flex-direction: column; gap: 2px; padding: 18px 20px; border-radius: 18px; border: 1px solid #E4E7EB; text-decoration: none;"><span style="font-weight: 700; color: #0E2340;">Explore designs</span><span style="font-size: 14px; color: #4A5462;">500+ ideas by room</span></a>
        <a href="Services.dc.html" style="display: flex; flex-direction: column; gap: 2px; padding: 18px 20px; border-radius: 18px; border: 1px solid #E4E7EB; text-decoration: none;"><span style="font-weight: 700; color: #0E2340;">Services</span><span style="font-size: 14px; color: #4A5462;">and the cost calculator</span></a>
        <a href="Start.dc.html" style="display: flex; flex-direction: column; gap: 2px; padding: 18px 20px; border-radius: 18px; background: #F2F7E3; text-decoration: none;"><span style="font-weight: 700; color: #0E2340;">Start a project</span><span style="font-size: 14px; color: #3B4552;">Free quote in 24 hours</span></a>
        <a href="About.dc.html#contact" style="display: flex; flex-direction: column; gap: 2px; padding: 18px 20px; border-radius: 18px; border: 1px solid #E4E7EB; text-decoration: none;"><span style="font-weight: 700; color: #0E2340;">Contact us</span><span style="font-size: 14px; color: #4A5462;">WhatsApp, phone or email</span></a>
      </div>
    </div>

    <div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 24px;">
      <div aria-hidden="true" style="position: relative; width: 340px; max-width: 100%; height: 360px;">
        <div class="bar" style="{{bar1}}"><svg width="240" height="110" viewBox="0 0 240 110"><path d="M0 50L240 0v60L0 110z" fill="#0E2340"></path></svg></div>
        <div class="bar" style="{{bar2}}"><svg width="210" height="100" viewBox="0 0 210 100"><path d="M0 46L210 0v54L0 100z" fill="#229E9F"></path></svg></div>
        <div class="bar" style="{{bar3}}"><svg width="180" height="92" viewBox="0 0 180 92"><path d="M0 42L180 0v50L0 92z" fill="#B6D22A"></path></svg></div>
      </div>
      <button type="button" onClick="{{toggle}}" style="height: 48px; padding: 0 22px; border-radius: 9999px; border: 1px solid #0E2340; background: #ffffff; font: inherit; font-size: 15px; font-weight: 600; color: #0E2340; cursor: pointer;">{{toggleLabel}}</button>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { fixed: false };
  }
  renderVals() {
    const fixed = this.state.fixed;
    const base = 'position: absolute; left: 50px; transition: transform 700ms cubic-bezier(0.22, 1, 0.36, 1); ';
    return {
      bar1: base + 'top: 40px; transform: ' + (fixed ? 'none' : 'translate(-30px, 150px) rotate(-28deg)') + ';',
      bar2: base + 'top: 150px; transform: ' + (fixed ? 'none' : 'translate(60px, 120px) rotate(18deg)') + ';',
      bar3: base + 'top: 255px; transform: ' + (fixed ? 'none' : 'translate(-10px, -210px) rotate(-62deg)') + ';',
      toggle: () => this.setState({ fixed: !fixed }),
      toggleLabel: fixed ? 'Knock it over again' : 'Put it back together'
    };
  }
}
</script>
</body>
</html>
